<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>推广导航</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  .container { width: 375px; min-height: 812px; background: linear-gradient(180deg, #0a0a2e 0%, #1a1a4e 50%, #0d0d3e 100%); position: relative; overflow: hidden; border-radius: 0; }
  .stars { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: radial-gradient(2px 2px at 15% 25%, rgba(255,255,255,0.9), transparent), radial-gradient(2px 2px at 35% 65%, rgba(255,255,255,0.8), transparent), radial-gradient(1px 1px at 55% 15%, rgba(255,255,255,0.7), transparent), radial-gradient(1px 1px at 75% 45%, rgba(255,255,255,0.6), transparent), radial-gradient(2px 2px at 85% 75%, rgba(255,255,255,0.8), transparent), radial-gradient(1px 1px at 5% 85%, rgba(255,255,255,0.5), transparent), radial-gradient(1px 1px at 45% 90%, rgba(255,255,255,0.6), transparent), radial-gradient(2px 2px at 95% 35%, rgba(255,255,255,0.9), transparent), radial-gradient(1px 1px at 25% 50%, rgba(255,255,255,0.4), transparent), radial-gradient(1px 1px at 65% 80%, rgba(255,255,255,0.5), transparent), radial-gradient(1px 1px at 50% 5%, rgba(255,255,255,0.8), transparent); }
  .nebula { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(ellipse at 30% 40%, rgba(80, 0, 140, 0.35) 0%, transparent 55%), radial-gradient(ellipse at 75% 15%, rgba(0, 80, 160, 0.25) 0%, transparent 50%), radial-gradient(ellipse at 50% 70%, rgba(180, 120, 0, 0.15) 0%, transparent 50%); }
  .golden-ray { position: absolute; top: 15%; left: -20%; width: 140%; height: 60px; background: linear-gradient(90deg, transparent, rgba(255, 200, 80, 0.15), rgba(255, 220, 120, 0.25), rgba(255, 200, 80, 0.15), transparent); transform: rotate(-8deg); filter: blur(8px); }
  .content { position: relative; z-index: 1; padding: 80px 18px 35px; text-align: center; display: flex; flex-direction: column; }
  .url-text { color: rgba(255,255,255,0.85); font-size: 16px; margin-bottom: 10px; }
  .title { color: #fff; font-size: 32px; font-weight: 900; margin-bottom: 28px; text-shadow: 0 0 22px rgba(100, 140, 255, 0.5); letter-spacing: 1px; }
  .announcement { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; padding: 14px 16px; margin-bottom: 28px; color: rgba(255,255,255,0.85); font-size: 15px; backdrop-filter: blur(10px); }
  .nav-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 24px; }
  .nav-card { border-radius: 14px; padding: 24px 10px; backdrop-filter: blur(10px); transition: transform 0.15s; cursor: pointer; }
  .nav-card:active { transform: scale(0.94); }
  .nav-card .nav-name { color: #fff; font-size: 18px; font-weight: 700; }
  .c-blue   { background: linear-gradient(135deg, #3b82f6, #2563eb); }
  .c-green  { background: linear-gradient(135deg, #22c55e, #16a34a); }
  .c-orange { background: linear-gradient(135deg, #f97316, #ea580c); }
  .c-pink   { background: linear-gradient(135deg, #ec4899, #db2777); }
  .c-purple { background: linear-gradient(135deg, #a855f7, #9333ea); }
  .c-red    { background: linear-gradient(135deg, #ef4444, #dc2626); }
  .save-bar { background: rgba(120, 180, 255, 0.18); border: 1px solid rgba(120, 180, 255, 0.3); border-radius: 12px; padding: 18px; color: #bfe0ff; font-size: 22px; font-weight: 900; margin-top: 10px; backdrop-filter: blur(10px); }
  .watermark { position: absolute; bottom: 8px; right: 10px; color: rgba(255,255,255,0.25); font-size: 10px; }
  a { text-decoration: none; display: block; }
</style>
</head>
<body>
  <div class="container">
    <div class="stars"></div>
    <div class="nebula"></div>
    <div class="golden-ray"></div>
    <div class="content">
      <div class="url-text">截图保存不变网址：3x26.cc</div>
      <div class="title">立即开启你的梦幻体验</div>
      <div class="announcement" id="announcement">📢 公告：本页面长期有效，请截图保存备用</div>

      <div class="nav-grid">
        <div class="nav-card c-blue" onclick="location.href='https://2v9v.cc'"><div class="nav-name">🔥太子视频👆</div></div>
        <div class="nav-card c-green" onclick="location.href='https://2v9v.cc'"><div class="nav-name">🔥太子视频👆</div></div>
        <div class="nav-card c-orange" onclick="location.href='https://3x2v.cc'"><div class="nav-name">🤍TD视频🤍</div></div>
        <div class="nav-card c-pink" onclick="location.href='http://1av3.cc'"><div class="nav-name">🤍玫瑰视频🤍</div></div>
        <div class="nav-card c-purple" onclick="location.href='http://6x8u.cc'"><div class="nav-name">💋蓝波视频💋</div></div>
        <div class="nav-card c-red" onclick="location.href='http://6x8u.cc'"><div class="nav-name">💋蓝波视频💋</div></div>
      </div>

      <div class="save-bar">截图保存 永久有效</div>
    </div>
    <div class="watermark">截图保存不变网址：3x26.cc</div>
  </div>
</body>
</html>
