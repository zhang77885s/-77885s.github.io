<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>午夜迷情</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
    min-height: 100vh;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    color: #fff; padding: 20px;
  }
  h1 { font-size: 34px; margin-bottom: 8px; font-weight: 700; letter-spacing: 2px; }
  .sub { color: rgba(255,255,255,.5); margin-bottom: 44px; font-size: 15px; }
  .choices { display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; }
  
  /* 这里是主要的卡片样式 */
  .choice {
    width: 280px; padding: 42px 28px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 22px;
    text-align: center; text-decoration: none; color: #fff;
    transition: all .3s ease;
    /* 去掉了原来的半透明背景，由下面的单独规则控制 */
  }
  
  /* 鼠标悬停效果 */
  .choice:hover {
    transform: translateY(-8px);
    box-shadow: 0 20px 40px -14px rgba(0,0,0,.5);
    border-color: rgba(255,255,255,.3);
  }

  /* 左边卡片：实心蓝色 */
  .choices a:first-child {
    background: #0066cc; 
  }
  .choices a:first-child:hover {
    background: #0055aa; /* 悬停时颜色加深 */
  }

  /* 右边卡片：实心红色 */
  .choices a:last-child {
    background: #cc3333; 
  }
  .choices a:last-child:hover {
    background: #aa2222; /* 悬停时颜色加深 */
  }

  .choice .emoji { font-size: 52px; display: block; margin-bottom: 18px; }
  .choice .title { font-size: 24px; font-weight: 600; margin-bottom: 10px; }
  .choice .desc { font-size: 14px; color: rgba(255,255,255,.9); line-height: 1.5; } /* 文字颜色稍微调亮以便阅读 */
  .choice .domain { margin-top: 18px; font-size: 13px; color: #fff; word-break: break-all; } /* 域名颜色改为纯白 */
  footer { margin-top: 54px; color: rgba(255,255,255,.2); font-size: 12px; }
  @media (max-width: 640px) { 
    .choice { width: 100%; max-width: 340px; } 
    /* 移动端适配：小屏幕下两个卡片都占满宽度，上下排列 */
    .choices { flex-direction: column; gap: 20px; }
  }
</style>
</head>
<body>
  <h1>✦ 午夜迷情 ✦</h1>
  </p> 解放天性，奴性陪伴                                         
                                                     


   
  <div class="choices">

      <div class="title">高清A片</div>
      <div class="desc">欧美 日韩</div>
      <div class="domain">3x2v.cc</div>
    </a>
    
    <a href="https://7m2y.cc" class="choice">

      <div class="title">同城约炮</div>
      <div class="desc">25岁禁</div>
      <div class="domain">7m2y.cc</div>
    </a>
  </div>
  
  <footer>18禁</footer>
</body>
</html>
